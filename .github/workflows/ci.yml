name: CI

on:
  push:
    branches: [main]
    # Skip CI when a change touches only docs / release metadata — nothing the
    # typecheck/build/test job exercises. paths-ignore only skips when EVERY
    # changed file matches, so any change to source, tests, build config, or a
    # workflow still runs the full matrix.
    paths-ignore: &ci-skip-paths
      - "**/*.md"
      - "docs/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore: *ci-skip-paths

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and runs tests.
permissions:
  contents: read

jobs:
  build-and-test:
    name: typecheck + build + test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Surface failures on every supported Node version, not just the first.
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the trailing
      # comment tracks the human-readable tag. Dependabot (github-actions)
      # refreshes both the SHA and the comment so the pins do not go stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step performs authenticated git ops; don't leave GITHUB_TOKEN
          # in .git/config during install/build/test.
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # native deps (better-sqlite3, fs-ext) build via node-gyp on the runner;
      # the matrix verifies they rebuild cleanly on Node 24 as well as 20.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Full suite runs locally in ~36s wall (vitest forks pool); the historic
      # `listen EPERM` failures were a local sandbox artifact, not present on CI.
      - name: Test
        run: npm test
