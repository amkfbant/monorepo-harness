version: 1
project_id: mini-commerce
description: Migrated from policies/repos/mini-commerce.yaml
repo:
  id: mini-commerce
  path: ../../mini-commerce
policy:
  template: strict-monorepo-v1
context_packs:
  default-docs:
    description: General project docs and shared contracts
    globs:
      - README.md
      - docs/**/*.md
      - packages/contracts/**/*.ts
      - packages/shared/**/*.ts
    max_bytes: 32768
    deny_secret_like: true
domains:
  - id: apps/catalog
    root: apps/catalog
    context_packs:
      - default-docs
    read:
      - README.md
      - docs/**
      - package.json
      - tsconfig.base.json
      - pnpm-workspace.yaml
      - packages/contracts/**
      - packages/shared/**
      - apps/catalog/**
    write:
      - apps/catalog/**
    deny_write:
      - apps/orders/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/**
    commands:
      allow:
        - node -e "console.log('lint ok')"
        - id: check-validation-file
          cmd: test
          args:
            - -f
            - apps/catalog/src/validation.ts
          timeout_ms: 30000
        - id: node-version
          cmd: node
          args:
            - --version
          env:
            NODE_ENV: test
      defaults:
        timeout_ms: 120000
        env_allowlist:
          - PATH
          - HOME
  - id: apps/orders
    root: apps/orders
    context_packs:
      - default-docs
    read:
      - README.md
      - docs/**
      - package.json
      - tsconfig.base.json
      - pnpm-workspace.yaml
      - packages/contracts/**
      - packages/shared/**
      - apps/orders/**
    write:
      - apps/orders/**
    deny_write:
      - apps/catalog/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/**
