repo_id: monorepo-harness
read: []
# Self-hosting uses ONE cross-cutting `self` domain (matches
# projects/monorepo-harness.yaml). A harness change spans src/, tests/ and
# docs/specs/ together (spec-driven), so a single domain fits; sibling domains
# would make strict-monorepo-v1 deny each other's roots (deny_write > write).
# Hand-authored — not generated from a registry; no .generated.json sidecar.
domains:
  self:
    read:
      - src/**
      - tests/**
      - docs/**
      - package.json
      - tsconfig.json
      - vitest.config.ts
    write:
      - src/**
      - tests/**
      - docs/specs/**
    deny_write:
      - .git/**
      - .github/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - tsconfig.json
      - dist/**
      - node_modules/**
    commands:
      allow:
        - id: typecheck
          cmd: npm
          args:
            - run
            - typecheck
          timeout_ms: 300000
        - id: vitest-run
          cmd: npx
          args:
            - vitest
            - run
          timeout_ms: 600000
      defaults:
        timeout_ms: 300000
        env_allowlist:
          - PATH
          - HOME
          - NODE_ENV
