repo_id: monorepo-harness
read: []
domains:
  docs:
    read:
      - docs/**
    write:
      - docs/**
    deny_write:
      - .git/**
      - .github/**
      - nx.json
      - package-lock.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src/**
      - tsconfig.base.json
      - turbo.json
      - yarn.lock
  src:
    read:
      - docs/**
      - package.json
      - src/**
      - tsconfig.base.json
    write:
      - src/**
    deny_write:
      - .git/**
      - .github/**
      - docs/**
      - nx.json
      - package-lock.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - turbo.json
      - yarn.lock
    commands:
      allow:
        - id: node-version
          cmd: node
          args:
            - --version
          env:
            NODE_ENV: test
      defaults:
        timeout_ms: 120000
        env_allowlist:
          - PATH
          - HOME
          - NODE_ENV
  self:
    read:
      - src/**
      - tests/**
      - docs/**
      - package.json
      - tsconfig.json
      - vitest.config.ts
    write:
      - src/**
      - tests/**
      - docs/specs/**
    deny_write:
      - .git/**
      - .github/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - tsconfig.json
      - dist/**
      - node_modules/**
    commands:
      allow:
        - id: typecheck
          cmd: npm
          args:
            - run
            - typecheck
          timeout_ms: 300000
        - id: vitest-run
          cmd: npx
          args:
            - vitest
            - run
          timeout_ms: 600000
      defaults:
        timeout_ms: 300000
        env_allowlist:
          - PATH
          - HOME
          - NODE_ENV
