repo_id: mini-commerce

read:
  - README.md
  - docs/**
  - package.json
  - tsconfig.base.json
  - pnpm-workspace.yaml
  - packages/contracts/**
  - packages/shared/**

domains:
  apps/catalog:
    read:
      - apps/catalog/**
      - docs/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - tsconfig.base.json
    write:
      - apps/catalog/**
    deny_write:
      - apps/orders/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/**
    commands:
      allow:
        # legacy string form (sh -c)
        - "node -e \"console.log('lint ok')\""
        # structured form: argv spawn, per-command timeout
        - id: check-validation-file
          cmd: test
          args: ["-f", "apps/catalog/src/validation.ts"]
          timeout_ms: 30000
        # structured form: per-command env override
        - id: node-version
          cmd: node
          args: ["--version"]
          env:
            NODE_ENV: test
      defaults:
        timeout_ms: 120000
        env_allowlist:
          - PATH
          - HOME

  apps/orders:
    read:
      - apps/orders/**
      - docs/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - tsconfig.base.json
    write:
      - apps/orders/**
    deny_write:
      - apps/catalog/**
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/**
