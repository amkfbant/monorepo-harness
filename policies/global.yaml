defaults:
  codex:
    sandbox: workspace-write
    approval: on-request
    timeout_ms: 900000

limits:
  git_timeout_ms: 30000

always_deny_write:
  - .git/**
  - .github/**
  - package.json
  - pnpm-lock.yaml
  - yarn.lock
  - package-lock.json
  - pnpm-workspace.yaml
  - turbo.json
  - nx.json
  - tsconfig.base.json
  - packages/shared/**
  - packages/contracts/**

# Patterns use minimatch (root-anchored), NOT gitignore semantics.
# `dist/**` only matches dist at the repo root; use `**/dist/**` to
# ignore every nested dist directory. See docs/policy-semantics.md.
ignore_untracked:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/.turbo/**"
  # Self-hosting: when the harness runs against its own repo, coder command/test
  # runs create a runtime DB under .harness/ in the worktree. It is a runtime
  # artifact (gitignored), never part of the reviewed change.
  - "**/.harness/**"
