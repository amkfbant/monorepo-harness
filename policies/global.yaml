defaults:
  codex:
    sandbox: workspace-write
    approval: on-request
    timeout_ms: 900000

limits:
  git_timeout_ms: 30000

always_deny_write:
  - .git/**
  - .github/**
  - package.json
  - pnpm-lock.yaml
  - yarn.lock
  - package-lock.json
  - pnpm-workspace.yaml
  - turbo.json
  - nx.json
  - tsconfig.base.json
  - packages/shared/**
  - packages/contracts/**

ignore_untracked:
  - node_modules/**
  - dist/**
  - coverage/**
  - .turbo/**
